server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  application:
    name: management-server
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/management;MODE=Oracle;DATABASE_TO_UPPER=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 6
      connection-timeout: 5000
      validation-timeout: 2000
      data-source-properties:
        oracle.net.CONNECT_TIMEOUT: 5000
        oracle.jdbc.ReadTimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
logging:
  file:
    name: ${LOG_FILE:/logs/application.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 2
      total-size-cap: 100MB
platform:
  jwt-secret: ${JWT_SECRET}
  agent:
    server-addr: ${NACOS_ADDR:localhost:8848}
    secondary-addr: ${NACOS_SECONDARY_ADDR:}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD}
    namespace: ${NACOS_NAMESPACE:}
    site: ${SITE:a}
    service: ${SERVICE_NAME:app1}
    ip: ${APP_IP:}
    port: ${SERVER_PORT:8080}
    register: ${REGISTER:true}
    gateways:
      a: ${GATEWAY_A:http://gateway-a:8080}
      b: ${GATEWAY_B:http://gateway-b:8080}
  admin-password: ${ADMIN_PASSWORD}
