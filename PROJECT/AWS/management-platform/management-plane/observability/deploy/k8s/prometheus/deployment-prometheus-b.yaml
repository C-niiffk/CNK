apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-b
  namespace: observability
  labels:
    app: prometheus
    site: b
    instance: prometheus-b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      instance: prometheus-b
  template:
    metadata:
      labels:
        app: prometheus
        site: b
        instance: prometheus-b
    spec:
      nodeSelector:
        site: b
      terminationGracePeriodSeconds: 40
      containers:
      - name: prometheus
        image: prom/prometheus:v3.2.1
        ports:
        - containerPort: 9090
        env: []
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 512Mi
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=3d
        - --web.enable-lifecycle
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        - name: rules
          mountPath: /rules
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 5
      - name: rule-sync
        image: '@@IMAGE_RULE_SYNC@@'
        ports: []
        env:
        - name: MANAGEMENT_URL
          value: http://management.platform.svc:8080
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: runtime
              key: ADMIN_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            memory: 96Mi
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: rules
          mountPath: /rules
      volumes:
      - name: config
        configMap:
          name: prometheus
      - name: data
        persistentVolumeClaim:
          claimName: prom-data-b
      - name: rules
        emptyDir: {}
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
