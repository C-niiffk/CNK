apiVersion: apps/v1
kind: Deployment
metadata:
  name: oap-b
  namespace: observability
  labels:
    app: oap
    site: b
    instance: oap-b
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      instance: oap-b
  template:
    metadata:
      labels:
        app: oap
        site: b
        instance: oap-b
    spec:
      nodeSelector:
        site: b
      terminationGracePeriodSeconds: 40
      containers:
      - name: oap
        image: apache/skywalking-oap-server:10.2.0
        ports:
        - containerPort: 11800
        - containerPort: 12800
        env:
        - name: SW_STORAGE
          value: elasticsearch
        - name: SW_STORAGE_ES_CLUSTER_NODES
          value: '@@ES_HOST_B@@:9200'
        - name: SW_CLUSTER
          value: standalone
        - name: SW_CORE_REST_PORT
          value: '12800'
        - name: JAVA_OPTS
          value: -Xms256m -Xmx768m
        - name: SW_STORAGE_ES_INDEX_REPLICAS_NUMBER
          value: '0'
        resources:
          requests:
            cpu: 200m
            memory: 1280Mi
          limits:
            memory: 1280Mi
        imagePullPolicy: IfNotPresent
        readinessProbe:
          tcpSocket:
            port: 12800
          periodSeconds: 5
        startupProbe:
          tcpSocket:
            port: 11800
          failureThreshold: 90
          periodSeconds: 5
      - name: storage-readiness
        image: curlimages/curl:8.12.1
        command:
        - /bin/sh
        - -c
        - while true; do sleep 3600; done
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - curl --fail --silent --max-time 3 @@ES_B@@/_cluster/health >/dev/null
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 2
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 48Mi
      volumes: []
