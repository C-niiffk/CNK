server:
  port: 8080
spring:
  config:
    import: optional:file:/config/routing.yml
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
platform:
  agent:
    server-addr: ${NACOS_ADDR}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD}
    register: false
routing:
  lock-table: ${ROUTING_LOCK_TABLE}
