apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos-b
  namespace: grdc
  labels:
    app: nacos
    site: b
    instance: nacos-b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      instance: nacos-b
  template:
    metadata:
      labels:
        app: nacos
        site: b
        instance: nacos-b
    spec:
      nodeSelector:
        site: b
      terminationGracePeriodSeconds: 40
      containers:
      - name: nacos
        image: '@@IMAGE_GRDC@@'
        ports:
        - containerPort: 8848
        - containerPort: 9848
        - containerPort: 8080
        env:
        - name: MODE
          value: standalone
        - name: PREFER_HOST_MODE
          value: ip
        - name: JVM_XMS
          value: 256m
        - name: JVM_XMX
          value: 768m
        - name: JVM_XMN
          value: 128m
        - name: GRDC_DB_URL
          value: '@@DB_URL@@'
        - name: GRDC_DB_USER
          value: MP_GRDCB
        - name: NACOS_AUTH_ENABLE
          value: 'true'
        - name: NACOS_AUTH_IDENTITY_KEY
          value: platformIdentity
        - name: GRDC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: runtime
              key: GRDC_B_DB_PASSWORD
        - name: NACOS_IDENTITY_VALUE
          valueFrom:
            secretKeyRef:
              name: runtime
              key: NACOS_IDENTITY_VALUE
        - name: NACOS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: runtime
              key: NACOS_AUTH_TOKEN
        - name: NACOS_AUTH_IDENTITY_VALUE
          valueFrom:
            secretKeyRef:
              name: runtime
              key: NACOS_IDENTITY_VALUE
        - name: SPRING_DATASOURCE_PLATFORM
          value: oracle
        resources:
          requests:
            cpu: 200m
            memory: 1280Mi
          limits:
            memory: 1280Mi
        imagePullPolicy: IfNotPresent
        startupProbe:
          tcpSocket:
            port: 8848
          failureThreshold: 90
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /nacos/v3/admin/core/state/readiness
            port: 8848
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 8848
          periodSeconds: 10
          failureThreshold: 6
      volumes: []
