spring:
  application:
    name: agent-service
  lifecycle:
    timeout-per-shutdown-phase: 100s
server:
  port: ${PORT:8090}
  address: ${BIND_ADDRESS:0.0.0.0}
  shutdown: graceful
  tomcat:
    basedir: /tmp/tomcat-agent
    max-http-form-post-size: 8KB
    max-swallow-size: 8KB
    threads:
      max: 16
      min-spare: 2
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
batch:
  internal-token: ${INTERNAL_TOKEN}
  app-id: ${APP_ID}
  claim-url: ${CLAIM_URL}
  application-url: ${APPLICATION_URL:http://127.0.0.1:8082}
  script-directory: ${SCRIPT_DIR:/opt/batch/scripts}
  work-directory: ${WORK_DIR:/work}
  timeout-seconds: ${JOB_TIMEOUT_SECONDS:60}
