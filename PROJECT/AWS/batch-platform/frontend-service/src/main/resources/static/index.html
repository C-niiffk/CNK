<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Batch Platform</title>
<style>body{font:16px system-ui;max-width:1200px;margin:40px auto;padding:0 24px;color:#172a3a;background:#f4f7fa}h1{margin-bottom:8px}form,section{background:white;padding:24px;border-radius:12px;margin:24px 0}label{display:inline-block;margin:8px}input,select,button{font:inherit;padding:8px;border:1px solid #bbc9d6;border-radius:5px}button{background:#153e65;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd;overflow-wrap:anywhere}pre{white-space:pre-wrap}small{color:#526778}.scroll{overflow:auto}</style>
<h1>Batch Platform</h1><p>Oracle 作業佇列 · ECS Fargate · SH / API</p>
<form id="job"><label>Application <select name="app"><option>app1</option><option>app2</option></select></label><label>類型 <select name="type"><option>SH</option><option>API</option></select></label><label>作業 <select name="name"><option>reconcile</option></select></label><label>業務日期 <input type="date" name="businessDate" required></label><br><label>Request key <input name="requestKey" size="45" pattern="[A-Za-z0-9_-]{8,100}" required></label><button type="submit">提交作業</button> <button type="button" id="newkey">新 Request key</button><p><small>網路失敗請保留原 key 重試。同 key、同內容會返回原作業。UNKNOWN 必須先核實業務結果。</small></p><pre id="notice"></pre></form>
<section><button id="refresh">重新整理</button><p>最近 100 筆，每 5 秒更新（時間為 UTC）</p><div class="scroll"><table><thead><tr><th>ID</th><th>App / 類型</th><th>日期</th><th>狀態</th><th>結果</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>
  const form=document.querySelector('#job'),notice=document.querySelector('#notice');
  function newKey(){form.elements.requestKey.value=crypto.randomUUID()}
  newKey();form.elements.businessDate.value=new Date().toISOString().slice(0,10);
  document.querySelector('#newkey').onclick=newKey;
  async function refresh(){try{let r=await fetch('/api/jobs');if(!r.ok)throw new Error('HTTP '+r.status);let jobs=await r.json();const rows=document.querySelector('#rows');rows.replaceChildren();for(const j of jobs){let tr=document.createElement('tr');for(const v of [j.id,j.app+' / '+j.job_type,j.business_date,j.status,j.result||'']){let td=document.createElement('td');td.textContent=v;tr.append(td)}rows.append(tr)}}catch(e){notice.textContent='讀取失敗：'+e.message}}
  form.onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/jobs',{method:'POST',headers:{'X-Batch-Request':'1'},body:new URLSearchParams(new FormData(form))});let result=await r.json();if(!r.ok)throw new Error(JSON.stringify(result));notice.textContent='已受理：'+result.id+'；新作業請產生新的 Request key。';refresh()}catch(err){notice.textContent='提交結果不明或被拒絕：'+err.message+'；請保留 key 查詢或重試。'}};
  document.querySelector('#refresh').onclick=refresh;refresh();setInterval(refresh,5000);
</script></html>
